name: Release

# On version tags, publishes Python wheels and a source distribution to PyPI and WebAssembly to
# npm, and attaches the Pyodide wheel and command-line binaries to the GitHub release. Both
# registries use trusted publishing: no API tokens are stored, each registry trusts this workflow
# and its environment (pypi, npm). CLB fork: no crates are published to crates.io (they share
# upstream's names and versions); the `crates` job packages and builds the crates instead, as
# release-dry-run.yml does. The artifacts are built by release-build.yml, which
# release-dry-run.yml can run manually before a release, without publishing. Then linux-packages.yml
# updates the AUR packages and builds the COPR one, with the two secrets it describes (the AUR
# and COPR have no trusted publishing), homebrew.yml tests the cask and pushes it to the tap, with
# the secret it describes, and docker.yml publishes the image to the GitHub Container Registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/release-build.yml

  github-release:
    # Once the packages are on PyPI, so that a release never announces a version that is not.
    needs: [build, publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pyodide-wheel
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Attach the Pyodide wheel and the command-line binaries to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --verify-tag --generate-notes
          gh release upload "$tag" dist/*.whl dist/terrio-cli-* --clobber

  linux-packages:
    # The AUR and COPR packages, once the release's binaries are on GitHub.
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      COPR_CONFIG: ${{ secrets.COPR_CONFIG }}

  homebrew:
    # The cask, once the release's binaries and checksums are on GitHub.
    needs: [github-release]
    # Final releases only: the cask's renderer refuses a pre-release, which the tap must not offer.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

  docker:
    # The image, once the packages are on PyPI, as for the GitHub release.
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      # The native wheels and the source distribution (the Pyodide wheel goes to the GitHub
      # release only).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  # CLB fork: the crates are NOT published (they share upstream's names and versions; the fork's
  # `zstd-rust` git dependency, which once also prevented it, was replaced by upstream's `zrip`).
  # This job checks what `cargo publish` would package and builds the crates, as
  # release-dry-run.yml does, so a tag fails here only for a real packaging or build error. The
  # wheels, the npm package and the command-line binaries are unaffected.
  crates:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
      # dtolnay/rust-toolchain is pinned to a master commit in every workflow: it has no release
      # tags, so Dependabot does not bump it; update all its pins together by hand.
      # The CLB fork publishes no crates: upstream's trusted-publishing steps are replaced by a
      # package listing and a build.
      - name: Package terrio-crs, terrio and terrio-cli (file lists) and build them; no publish
        run: |
          cargo package --list --locked -p terrio-crs -p terrio -p terrio-cli
          cargo build --locked -p terrio-crs -p terrio -p terrio-cli

  npm:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The threaded and memory64 modules (js/build.mjs): the nightly it pins, with the standard
      # library's sources.
      # Installed first: the last toolchain installed is the default (stable).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: nightly-2026-10-15
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-pack@0.15.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later. Pinned: this job holds the OIDC publishing
      # rights, so a new npm release is taken by a reviewed change, not on the next run.
      - run: npm install -g npm@12.2.2
      - name: Build the package (browsers, bundlers, and Node.js through init)
        run: |
          node js/build.mjs
          node .github/scripts/npm-notices.mjs js/pkg
      - name: Publish unless this version is already on npm
        working-directory: js/pkg
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "terrio-js@$version" version > /dev/null 2>&1; then
            echo "terrio-js $version is already on npm"
          else
            npm publish --access public
          fi
