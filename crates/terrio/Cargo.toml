[package]
name = "terrio"
description = "Pure-Rust geospatial raster, vector and point cloud data I/O: read, write, convert and reproject GIS formats without C dependencies"
readme = "../../README.md"
documentation = "https://docs.rs/terrio"
keywords = ["gis", "geospatial", "raster", "vector", "point-cloud"]
categories = ["science::geo", "parser-implementations", "encoding"]
version.workspace = true
edition.workspace = true
# MPL-2.0 for pointcloud/filters/selfadjoint.rs, a port of Eigen's eigensolver.
license = "MIT AND MPL-2.0"
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[package.metadata.docs.rs]
# The GDAL backend's API is documented too: gdal-sys builds docs without GDAL installed.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
terrio-crs = { workspace = true, features = ["wbprojection-fallback"] }
wbraster.workspace = true
wbvector.workspace = true
wbprojection.workspace = true
geographiclib-rs.workspace = true
geo.workspace = true
rstar.workspace = true
spade.workspace = true
thiserror.workspace = true
serde.workspace = true
shlex.workspace = true
# Keeps JSON object keys (properties, fields) in file order, and parses numbers exactly.
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip", "raw_value"] }
zip.workspace = true
tiff.workspace = true
acadrust = { workspace = true, optional = true }
flatgeobuf = { workspace = true, optional = true }
flatbuffers = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
arrow-ipc = { workspace = true, optional = true }
arrow-buffer = { workspace = true, optional = true }
arrow-select = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
quick-xml.workspace = true
encoding_rs.workspace = true
osmpbfreader = { workspace = true, optional = true }
half.workspace = true
flate2.workspace = true
fdeflate.workspace = true
weezl.workspace = true
png.workspace = true
lz4_flex = { workspace = true, optional = true }
ruzstd.workspace = true
netcdf-reader = { workspace = true, optional = true }
hdf5-reader = { workspace = true, optional = true }
ras-commander-fast-hdf = { workspace = true, optional = true }
jpeg-decoder.workspace = true
laz = { workspace = true, optional = true }
e57 = { workspace = true, optional = true }
delaunator = { workspace = true, optional = true }
jpeg-encoder.workspace = true
image-webp.workspace = true
webp-rust.workspace = true
# JPEG 2000, in WebAssembly builds too (see `drivers::jp2` for the allocator it links against).
openjp2 = { workspace = true, optional = true }
lerc-reader = { workspace = true, optional = true }
lerc-core = { workspace = true, optional = true }
lerc-writer = { workspace = true, optional = true }
zune-jpegxl.workspace = true
zune-core.workspace = true
jxl-oxide.workspace = true
# Data parallelism: natively, and in WebAssembly built with threads (`atomics`), where the host
# starts the pool; WebAssembly without threads runs the same loops in sequence (see `par`).
rayon.workspace = true
rusty_av1d = { workspace = true, optional = true }
lzma-rust2 = { workspace = true, optional = true }
# GRIB2's CCSDS packing (template 5.42): a pure-Rust decoder of CCSDS 121.0-B-3 (libaec's format).
rust-aec = { version = "0.1.1", optional = true }

# The optional GDAL backend: opens what GDAL can when terrio has no driver for it. Needs GDAL
# (3.4 or later) installed, found with pkg-config or GDAL_HOME.
gdal = { workspace = true, optional = true }
gdal-sys = { workspace = true, optional = true }
# Array views of raster pixels and owned transfers between rasters and arrays (the `ndarray`
# feature), without copying the pixels.
ndarray = { workspace = true, optional = true }

# Every driver is on by default (`drivers` and `remote`). Zstandard is pure Rust (`ruzstd`); the
# zstd C library is opt-in (`libzstd-*`). A build with `default-features = false`
# keeps the core: GeoTIFF and COG (deflate, LZW, PackBits, ZSTD, WebP, JPEG, JPEG XL), the raw and
# ASCII rasters (AAIGrid, EHdr, ENVI, ERS, HFA, RST, SAGA, GSBG, XYZ...), PNG, JPEG, VRT, GeoJSON,
# Shapefile, KML/KMZ, GML, GPX, CSV, MapInfo, the CRS engine and the operations, without C
# (Zstandard with `ruzstd`). `default-features = false, features = ["drivers"]` is every driver
# without C, for hosts with no C toolchain: everything but remote inputs, whose HTTPS is `ring`. Disabled drivers stay in the API (`RasterDriver`,
# `VectorDriver`) and fail with "built without the `...` feature".
[features]
default = ["drivers", "remote"]
## Every format driver: the default features but `remote`, so pure Rust (no C compiler needed)
## natively as in WebAssembly.
drivers = ["cad", "geotiff", "parquet", "avif", "netcdf-hdf5", "osm", "lzma", "flatgeobuf", "jp2", "lerc", "pointcloud", "tiles", "zarr", "sqlite", "grib", "hecras", "xlsx", "filegdb"]
## GeoTIFF and COG reading and writing. Always built (it is the core): the feature exists so that
## `features = ["geotiff"]` states what a build needs.
geotiff = []
## DWG and ASCII/binary DXF reading and writing, through acadrust.
cad = ["dep:acadrust"]
## GeoParquet (the `geoparquet` module of Arrow layers included), the `arrow` module and Arrow
## streams of vector layers.
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema", "dep:arrow-ipc", "dep:arrow-buffer", "dep:arrow-select", "dep:bytes"]
## ZSTD GeoParquet pages written by the `parquet` crate's own codec, the zstd C library. Opt-in:
## without it terrio has the crate write the pages uncompressed and compresses each one itself,
## with `ruzstd` (or the C library with `libzstd-geoparquet`), so the default and WebAssembly builds
## write ZSTD GeoParquet without C. Pages, encodings, dictionaries and statistics are the same either way.
parquet-zstd = ["parquet", "parquet/zstd"]
## HTTP(S), S3, GCS and Azure inputs, range reads of remote COGs and STAC (native builds only).
## HTTPS uses `rustls` with `ring` (C and assembly, CLB fork), so natively this feature needs a C
## compiler; in WebAssembly it builds nothing. Not in `drivers`, on by default.
remote = ["dep:ureq", "dep:hmac", "dep:sha2", "terrio-crs/grid-transport"]
## AVIF tiles of PMTiles and MBTiles archives.
avif = ["tiles", "dep:rusty_av1d"]
## NetCDF, HDF5 and HDF-EOS reading, netCDF writing.
netcdf-hdf5 = ["dep:netcdf-reader", "dep:hdf5-reader"]
## HEC-RAS geometry (`.g##.hdf`) and plan (`.p##.hdf`) HDF files as vector layers (read only),
## through the ras-commander-fast-hdf engine and its Arrow layers. With `parquet` too, the
## direct HEC-RAS HDF to archive GeoParquet path (`hecras::archive`).
## Needs `netcdf-hdf5`: HEC-RAS files stay readable as HDF5 rasters, and in-memory opens find
## the root `File Type` with terrio's HDF5 reader.
hecras = ["netcdf-hdf5", "dep:ras-commander-fast-hdf", "ras-commander-fast-hdf/arrow", "dep:arrow-array", "dep:arrow-schema"]
## XLSX and XLSM workbooks as vector layers (pure Rust).
xlsx = []
## Esri File Geodatabases (`.gdb` directories), in pure Rust: the read-only `OpenFileGDB` vector
## driver and the `filegdb` module, which writes them too. Native builds only: a geodatabase is a
## directory, and WebAssembly has no file system to hold one, so there the feature builds nothing.
filegdb = []
## OpenStreetMap PBF and XML.
osm = ["dep:osmpbfreader", "wbvector/osmpbf"]
## LZMA-compressed GeoTIFFs.
lzma = ["dep:lzma-rust2"]
## FlatGeobuf.
flatgeobuf = ["dep:flatgeobuf", "dep:flatbuffers"]
## JPEG 2000.
jp2 = ["dep:openjp2"]
## GRIB1 and GRIB2 reading (pure Rust). GRIB2's JPEG 2000 packing needs `jp2` too.
grib = ["dep:rust-aec"]
## LERC-compressed GeoTIFFs (read and written).
lerc = ["dep:lerc-reader", "dep:lerc-core", "dep:lerc-writer"]
## Point clouds: LAS, LAZ, COPC, EPT, E57, PLY (the `pointcloud` module).
pointcloud = ["dep:laz", "dep:e57", "dep:delaunator"]
## Raster and vector tiles: MBTiles, PMTiles and MVT (the `tiles` module).
tiles = ["sqlite"]
## Zarr v2 and v3.
zarr = ["dep:lz4_flex"]
## GeoPackage (vector and raster tiles), SQLite/SpatiaLite and the SQLite store of MBTiles.
sqlite = []
## Zstandard of GeoTIFF/COG chunks (ZSTD and LERC_ZSTD writing, ZSTD reading) with the zstd C
## library, in native builds. Opt-in (it was a default feature of the CLB fork from 2026-11-08 to
## 2026-11-10): it writes the C library's bytes at each of zstd's 22 levels, on one thread in
## 0.7 to 1.15 of the time. Without it, and always in WebAssembly, GeoTIFF/COG Zstandard is the
## pure-Rust `ruzstd` (the `zstd-rust` crate), which reads these as fast, writes them to within
## about 3% of the size at levels 1 to 9 and larger above (docs/testing.md, "Zstandard: pure Rust
## against the C library"), decodes to the same pixels and maps zstd's levels to its four (`Fastest`,
## `Default`, `Better`, `Best`; see `zstandard::pure::ruzstd_level`). terrio decodes every ZSTD GeoTIFF
## chunk itself, Float16, complex and WhiteIsZero samples included: the `tiff` crate is built
## without its Zstandard (zstd 0.13, whose streaming decoder has known advisories), so ZSTD datum
## grids, which terrio-crs reads with the crate, are not read (PROJ's are DEFLATE-compressed).
libzstd-geotiff = ["dep:zstd"]
## Zstandard of EPT tiles (the `pointcloud` feature) with the zstd C library, natively. Opt-in:
## without it, and in WebAssembly, `ruzstd`.
libzstd-ept = ["dep:zstd"]
## Zstandard of the GeoParquet pages terrio compresses itself (ZSTD GeoParquet written without
## `parquet-zstd`, and every ZSTD page read; the `parquet` feature) with the zstd C library,
## natively. Opt-in: without it, and in WebAssembly, `ruzstd`. Zarr's Zstandard is `ruzstd` in
## every build.
libzstd-geoparquet = ["dep:zstd"]
## Every Zstandard path above with the zstd C library: `libzstd-geotiff`, `libzstd-ept` and
## `libzstd-geoparquet`. The C library compresses in 0.6 to 0.85 of the time of `ruzstd` (a
## chunk alone, by platform), to about the same size at levels 1 to 9, and decodes in 0.73 to 1.09
## of its time.
libzstd = ["libzstd-geotiff", "libzstd-ept", "libzstd-geoparquet"]
## Open any format GDAL reads, through the same data model, when terrio has no driver for it.
gdal = ["dep:gdal", "dep:gdal-sys"]
## Raster pixels as `ndarray` arrays without copying them: borrowed and mutable views, owned
## transfers between rasters and arrays, and lazy reads' masks as arrays; floating-point windows
## (NaN where pixels are invalid) as owned arrays, bands first or last. Re-exports the crate as
## `terrio::ndarray`. Off by default.
ndarray = ["dep:ndarray"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# The `libzstd-*` features' zstd C library, natively (in WebAssembly, `ruzstd` whatever the features).
memmap2.workspace = true
zstd = { workspace = true, optional = true }
tempfile.workspace = true
# Listing and extracting tar archives (`terrio::vsi`).
tar.workspace = true
ureq = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
# Windows file identity (including hard links) for dataset destination guards.
same-file.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[example]]
name = "bench"
required-features = ["filegdb"]

[[example]]
name = "gdbcopy"
required-features = ["filegdb"]

[[example]]
name = "gdbdump"
required-features = ["filegdb"]

[[example]]
name = "items"
required-features = ["filegdb"]

[[example]]
name = "rawgeom"
required-features = ["filegdb"]

[[example]]
name = "sample_columns"
required-features = ["parquet"]
