[package]
name = "terrio-cli"
description = "Command-line interface for terrio: GDAL-style info, convert, translate and warp in pure Rust"
readme = "../../README.md"
keywords = ["gis", "geospatial", "gdal", "raster", "vector"]
categories = ["science::geo", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["remote", "ring-fallback", "zstd-rust"]
## GeoTIFF/COG Zstandard with the zstd C library (`terrio/libzstd-geotiff`), opt-in: without it
## the command writes and reads it in pure Rust.
libzstd-geotiff = ["terrio/libzstd-geotiff"]
## Zstandard levels above 4 in pure Rust (`terrio/zstd-rust`), on by default in the CLB fork:
## without it, and without `libzstd-geotiff`, `ZSTD_LEVEL` above 4 writes level 4.
zstd-rust = ["terrio/zstd-rust"]
## Remote inputs (`terrio/remote`): HTTP(S), S3, GCS and Azure, with `rustls-graviola`.
remote = ["terrio/remote"]
## HTTPS with `ring` on CPUs `rustls-graviola` cannot run on (`terrio/ring-fallback`; C and
## assembly). On by default in the CLB fork, so HTTPS works on every CPU as it did with `ring`
## alone; `--no-default-features` builds the command without C.
ring-fallback = ["remote", "terrio/ring-fallback"]
## The optional GDAL backend: open anything GDAL can (`GDAL:` paths, `--driver gdal`), write
## rasters with GDAL's drivers (`-f NITF`). Needs GDAL installed.
gdal = ["terrio/gdal"]

# The command line as a library (`terrio_cli::run`), which the Python package's `terrio` command
# runs too.
[lib]
name = "terrio_cli"
path = "src/lib.rs"

[[bin]]
name = "terrio"
path = "src/main.rs"

# CPU instructions, estimated cycles and peak heap of the commands of benches/cases.txt (the `bench` workflow).
[[bench]]
name = "commands"
harness = false

# `cargo binstall terrio-cli` installs the binaries attached to the GitHub release
# (release-build.yml); Linux hosts get the static musl builds.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/terrio-cli-v{ version }-{ target }{ archive-suffix }"
bin-dir = "terrio-cli-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
terrio.workspace = true
clap.workspace = true
serde_json.workspace = true
getrandom.workspace = true
tempfile.workspace = true

# Silencing drivers' prints (`cmd::quiet`): WASI has no file descriptors to redirect.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
gag.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The drives the file browser of `terrio ui` lists above a drive's root.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
parquet.workspace = true
sha2.workspace = true
gungraun.workspace = true
