[package]
name = "terrio-py"
description = "Python bindings for terrio"
publish = false
version.workspace = true
edition.workspace = true
# Bundles terrio, whose point cloud eigensolver is MPL-2.0.
# Apache-2.0 for the coverage-weighted median adapted from exactextract.
license = "MIT AND MPL-2.0 AND Apache-2.0"
rust-version.workspace = true
repository.workspace = true

[lib]
name = "_terrio"
crate-type = ["cdylib"]
# The extension module links to Python only when it is loaded: built by maturin, tested by pytest.
test = false
doctest = false

[features]
## The optional GDAL backend (`terrio/gdal`): `maturin build --features gdal`, with GDAL 3.4 or
## later installed where pkg-config (or GDAL_HOME) finds it.
gdal = ["terrio/gdal", "terrio-cli/gdal"]
## HEC-RAS geometry and plan HDF files (`terrio/hecras`, a default terrio feature) and their
## archive GeoParquet path, in the package by default.
hecras = ["terrio/hecras"]
## ZSTD GeoParquet pages written by the `parquet` crate's codec, the zstd C library
## (`terrio/parquet-zstd`), opt-in; without it (the wheels), terrio compresses the same pages in
## pure Rust.
parquet-zstd = ["terrio/parquet-zstd"]
## GeoTIFF/COG Zstandard with the zstd C library (`terrio/libzstd-geotiff`), opt-in: the wheels
## write and read it in pure Rust (`zrip`, and `zstd-rust` above level 4), as the Pyodide wheel
## does whatever the features.
libzstd-geotiff = ["terrio/libzstd-geotiff", "terrio-cli/libzstd-geotiff"]
## GeoTIFF, EPT and GeoParquet Zstandard with the zstd C library (`terrio/libzstd`).
libzstd = ["terrio/libzstd", "libzstd-geotiff"]
## Remote inputs (`terrio/remote`), in the native wheels by default; HTTPS is `rustls` with
## `rustls-graviola`. The Pyodide wheel builds no HTTP client whatever the features.
remote = ["terrio/remote", "terrio-cli/remote"]
## HTTPS with `ring` on CPUs `rustls-graviola` cannot run on (`terrio/ring-fallback`). On by
## default in the CLB fork's wheels, so HTTPS works on every CPU as it did with `ring` alone;
## needs a C compiler.
ring-fallback = ["remote", "terrio/ring-fallback", "terrio-cli/ring-fallback"]
## Zstandard levels above 4 in pure Rust (`terrio/zstd-rust`), on by default in the CLB fork's
## wheels, the Pyodide wheel's included: without it, and without the `libzstd-*` features, a level
## above 4 writes level 4.
zstd-rust = ["terrio/zstd-rust", "terrio-cli/zstd-rust"]
default = ["hecras", "remote", "ring-fallback", "zstd-rust"]

[dependencies]
terrio.workspace = true
pyo3 = { version = "0.29", features = ["abi3-py310"] }
numpy = "0.29"
wbraster.workspace = true
wbvector.workspace = true
serde_json.workspace = true
serde.workspace = true
# The Arrow C data and stream interfaces, for the Arrow PyCapsule interface.
arrow-array = { workspace = true, features = ["ffi"] }

# `madvise` for the allocator that backs large buffers with huge pages (`hugepage_alloc`).
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

# The `terrio` command (`terrio.__main__`); not in the Pyodide wheel, where there is no shell.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
terrio-cli.workspace = true
